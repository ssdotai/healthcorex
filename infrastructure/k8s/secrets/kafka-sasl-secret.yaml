# Kafka SASL Credentials Secret Template
#
# IMPORTANT: Do not commit actual credentials. This is a template.
# Create the actual secret using kubectl or external secrets operator.
#
# kubectl create secret generic kafka-sasl-secret \
#   --from-literal=mechanism=SCRAM-SHA-512 \
#   --from-literal=username=HealthCoreX \
#   --from-literal=password=your-password \
#   -n HealthCoreX

apiVersion: v1
kind: Secret
metadata:
  name: kafka-sasl-secret
  namespace: HealthCoreX
  labels:
    app.kubernetes.io/name: kafka-sasl-secret
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: HealthCoreX
    hipaa.compliance: "required"
  annotations:
    description: "SASL credentials for Kafka authentication"
    security.policy: "rotate-90-days"
type: Opaque
stringData:
  # PLACEHOLDER VALUES - REPLACE IN PRODUCTION
  mechanism: "SCRAM-SHA-512"
  username: "REPLACE_WITH_KAFKA_USERNAME"
  password: "REPLACE_WITH_KAFKA_PASSWORD"
